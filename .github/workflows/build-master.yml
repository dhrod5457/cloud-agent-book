name: Build master manuscript

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'manuscript/**'
      - 'chapters/**'
      - '.github/workflows/build-master.yml'
      - '!manuscript/master.md'

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build manuscript/master.md
        shell: bash
        run: |
          set -euo pipefail

          files=(
            manuscript/title-page.md
            manuscript/preface.md
            manuscript/about-this-book.md
            manuscript/how-to-read.md
            manuscript/table-of-contents.md
            manuscript/parts/part-01.md
            chapters/01/draft.md
            chapters/02/draft.md
            chapters/03/draft.md
            chapters/04/draft.md
            manuscript/parts/part-02.md
            chapters/05/draft.md
            chapters/06/draft.md
            chapters/07/draft.md
            chapters/08/draft.md
            manuscript/parts/part-03.md
            chapters/09/draft.md
            chapters/10/draft.md
            chapters/11/draft.md
            chapters/12/draft.md
            manuscript/parts/part-04.md
            chapters/13/draft.md
            chapters/14/draft.md
            manuscript/parts/part-05.md
            chapters/15/draft.md
            chapters/16/draft.md
            manuscript/parts/part-06.md
            chapters/17/draft.md
            chapters/18/draft.md
            manuscript/appendix/task-contract-evidence-template.md
            manuscript/glossary.md
            manuscript/references.md
          )

          if [ "${#files[@]}" -ne 32 ]; then
            echo "Expected 32 source files, got ${#files[@]}" >&2
            exit 1
          fi

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing source file: $file" >&2
              exit 1
            fi

            cat "$file" >> "$tmp"
            printf '\n\n' >> "$tmp"
          done

          mv "$tmp" manuscript/master.md

          chapter_count=$(grep -Ec '^# [0-9]+장\.' manuscript/master.md || true)
          part_heading_count=$(grep -Ec '^# Part (I|II|III|IV|V|VI)\.' manuscript/master.md || true)
          appendix_count=$(grep -Ec '^# 부록 A\.' manuscript/master.md || true)
          glossary_count=$(grep -Ec '^# 용어집$' manuscript/master.md || true)
          references_count=$(grep -Ec '^# 참고자료$' manuscript/master.md || true)

          if [ "$chapter_count" -ne 18 ]; then
            echo "Expected 18 chapter titles, got $chapter_count" >&2
            exit 1
          fi

          # Part headings occur once in the TOC and once on each Part transition page.
          if [ "$part_heading_count" -ne 12 ]; then
            echo "Expected 12 Part heading occurrences, got $part_heading_count" >&2
            exit 1
          fi

          if [ "$appendix_count" -lt 1 ] || [ "$glossary_count" -lt 1 ] || [ "$references_count" -lt 1 ]; then
            echo "Back Matter headings are incomplete" >&2
            exit 1
          fi

          echo "master.md generated"
          echo "chapter titles: $chapter_count"
          echo "Part heading occurrences: $part_heading_count"
          echo "appendix headings: $appendix_count"
          echo "glossary headings: $glossary_count"
          echo "references headings: $references_count"
          wc -l -w -c manuscript/master.md

      - name: Commit generated master if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- manuscript/master.md && git ls-files --error-unmatch manuscript/master.md >/dev/null 2>&1; then
            echo "master.md is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/master.md
          git commit -m "build: refresh master manuscript"
          git push
